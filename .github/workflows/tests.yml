name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install -r requirements-test.txt
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import homeassistant
          root = pathlib.Path(homeassistant.__file__).parent / 'components'
          requirements = []
          for component in ('bluetooth', 'usb'):
              requirements.extend(json.loads((root / component / 'manifest.json').read_text())['requirements'])
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *requirements])
          PY
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
